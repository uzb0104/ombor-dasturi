# 5 ta alohida mijoz (do'kon) uchun tayyor Docker Compose konfiguratsiyasi
# Har bir mijoz o'zining alohida porti, ma'lumotlar bazasi va xotirasiga ega bo'ladi (100% mustaqil)

services:
  # ==========================================
  # 1-MIJOZ (Do'kon 1)
  # ==========================================
  store1-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 5101
      REDIS_URL: redis://store1-redis:6379
      DB_JSON_PATH: /data/db.json
    ports:
      - "5101:5101"
    depends_on:
      store1-redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - store1-data:/data

  store1-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${STORE1_API_URL:-http://localhost:5101}
    ports:
      - "4101:4173"
    depends_on:
      - store1-backend
    restart: unless-stopped

  store1-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - store1-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

